name: Release

on:
  release:
    # Runs when a release is published in GitHub (draft -> published, or a new
    # published release). The release already exists, so we just attach binaries.
    types: [published]

permissions:
  contents: write # to upload release assets
  id-token: write # to sign the provenance attestations
  attestations: write # to store them

jobs:
  release:
    name: Build & attach binaries
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit, which a tag is not; Dependabot updates them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest Go, not go.mod's minimum: the binaries carry its standard
      # library, so each release gets every security fix made so far.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build and package all targets
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Outside the checkout, so the binaries are not stamped as built
          # from modified sources.
          dist="$RUNNER_TEMP/dist" build="$RUNNER_TEMP/build"
          mkdir -p "$dist" "$build"
          ver="${TAG#v}" # strip a leading "v" if present
          ldflags="-s -w -X main.version=${ver}"
          # Windows-on-ARM runs x64 under emulation, so one Windows build suffices.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"; arch="${target#*/}"
            # Asset OS name: darwin -> macos.
            osname="$goos"; [ "$goos" = "darwin" ] && osname="macos"
            bin="dbgp"; [ "$goos" = "windows" ] && bin="dbgp.exe"

            echo "building $osname/$arch"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" -o "$build/$bin" ./cmd/dbgp
            chmod +x "$build/$bin"

            # Package into an archive so the executable bit survives download
            # (raw GitHub release assets lose Unix permissions).
            base="dbgp-${osname}-${arch}"
            if [ "$goos" = "windows" ]; then
              (cd "$build" && zip -q "$dist/${base}.zip" "$bin")
            else
              tar -C "$build" -czf "$dist/${base}.tar.gz" "$bin"
            fi
            rm -f "$build/$bin"
          done
          # Attach the install scripts too, so releases/latest/download/install.sh
          # is a stable URL that serves the released version of the script.
          cp scripts/install.sh scripts/install.ps1 "$dist/"
          # The install scripts check downloads against these.
          (cd "$dist" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" "$dist/"
          cat "$dist/SHA256SUMS"

      # Records that each file was built here, from this commit: verify one
      # with gh attestation verify FILE --repo php-debugger/dbgp-client.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/dist/SHA256SUMS

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --clobber
