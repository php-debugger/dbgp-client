name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Self-contained PHP interpreter with PHP Debugger compiled in, from the
      # latest php-debugger release.
      - name: Install PHP Debugger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/php-debugger/bin"
          mkdir -p "$dir"
          gh release download --repo php-debugger/php-debugger \
            --pattern "php-php${{ matrix.php }}-nts-linux-x86_64" \
            --output "$dir/php"
          chmod +x "$dir/php"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Show PHP and debugger versions
        run: |
          php -v
          php -r 'exit(extension_loaded("php_debugger") ? 0 : 1);'
      - name: go test
        env:
          DBGP_REQUIRE_ENGINE: '1'
        run: go test -race -count=1 -v ./...
