name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    # Linux with every PHP version, and Windows with the newest.
    name: test (${{ matrix.os == 'windows-latest' && 'Windows, ' || '' }}PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.2', '8.3', '8.4', '8.5']
        include:
          - os: windows-latest
            php: '8.5'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # PHP Debugger, from its latest release: on Linux, a self-contained PHP
      # interpreter with it compiled in; on Windows, where the release has only
      # the extension, the official PHP build with the extension loaded.
      - name: Install PHP Debugger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/php-debugger/bin"
          mkdir -p "$dir"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/php.zip" \
              "https://downloads.php.net/~windows/releases/latest/php-${{ matrix.php }}-nts-Win32-vs17-x64-latest.zip"
            unzip -q "$RUNNER_TEMP/php.zip" -d "$dir"
            gh release download --repo php-debugger/php-debugger \
              --pattern "php_php-debugger-php${{ matrix.php }}-nts-windows-x64.dll" \
              --output "$dir/ext/php_php_debugger.dll"
            # PHP reads the php.ini next to php.exe.
            printf 'extension_dir="%s"\nzend_extension=php_debugger\n' "$(cygpath -w "$dir/ext")" > "$dir/php.ini"
          else
            gh release download --repo php-debugger/php-debugger \
              --pattern "php-php${{ matrix.php }}-nts-linux-x86_64" \
              --output "$dir/php"
            chmod +x "$dir/php"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: Show PHP and debugger versions
        run: |
          php -v
          php -r 'exit(extension_loaded("php_debugger") ? 0 : 1);'
      - name: go test
        env:
          DBGP_REQUIRE_ENGINE: '1'
        run: go test -race -count=1 -v ./...

  # The install scripts, run as users run them, against the latest release.
  install:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          cat scripts/install.sh | sh
          dbgp -version
          # A chosen release, to a directory of its own.
          INSTALL_DIR="$RUNNER_TEMP/dbgp" VERSION=0.1.0 sh scripts/install.sh
          test "$("$RUNNER_TEMP/dbgp/dbgp" -version)" = "dbgp 0.1.0"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          $dir = Join-Path $env:ProgramFiles "dbgp"
          & (Join-Path $dir "dbgp.exe") -version
          if (-not (([Environment]::GetEnvironmentVariable("Path", "Machine") -split ';') -contains $dir)) {
            throw "$dir is not on the system PATH"
          }
          # A chosen release, to a directory of its own: it goes on the
          # user PATH, not the system one, although this runs as admin.
          $env:INSTALL_DIR = Join-Path $env:RUNNER_TEMP "dbgp"
          $env:VERSION = "0.1.0"
          ./scripts/install.ps1
          $got = & (Join-Path $env:INSTALL_DIR "dbgp.exe") -version
          if ($got -ne "dbgp 0.1.0") { throw "installed $got, want dbgp 0.1.0" }
          function OnPath($scope, $dir) { ([Environment]::GetEnvironmentVariable("Path", $scope) -split ';') -contains $dir }
          if (-not (OnPath "User" $env:INSTALL_DIR)) { throw "$env:INSTALL_DIR is not on the user PATH" }
          if (OnPath "Machine" $env:INSTALL_DIR) { throw "$env:INSTALL_DIR is on the system PATH" }
          # A relative directory goes on the PATH as a full path.
          Push-Location $env:RUNNER_TEMP
          $env:INSTALL_DIR = "relative-dbgp"
          & (Join-Path $env:GITHUB_WORKSPACE "scripts/install.ps1")
          Pop-Location
          $full = Join-Path $env:RUNNER_TEMP "relative-dbgp"
          if (-not (OnPath "User" $full)) { throw "$full is not on the user PATH" }
          if (OnPath "User" "relative-dbgp") { throw "the relative directory is on the user PATH" }
